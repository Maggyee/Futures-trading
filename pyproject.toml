[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ctp-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "vnpy==4.4.0", "vnpy_ctp==6.7.11.4", "vnpy_ctastrategy==1.4.1",
  "vnpy_sqlite==1.1.3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20", "argon2-cffi>=23"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28", "ruff>=0.16"]
research = ["numpy>=2,<3", "pandas>=2.2,<4", "TA-Lib>=0.6,<1", "plotly>=6,<8"]
research-parquet = ["pyarrow>=18,<25"]
research-vnpy = ["vnpy_portfoliostrategy==1.3.0"]

[tool.setuptools.packages.find]
include = ["backend*", "research*"]

[tool.setuptools.package-data]
research = ["examples/*.json", "examples/*.csv", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Runtime selection must precede vn.py imports, which capture cwd at import time.
"backend/worker.py" = ["E402"]
"backend/backtest.py" = ["E402"]
"tests/conftest.py" = ["E402", "F401"]
"tests/browser_server.py" = ["E402"]
"tests/paper_worker.py" = ["E402"]
