[Service]
ExecStart=
ExecStart=/usr/bin/rclone mount gdrive: /home/nishiki/googledrive --config=/home/nishiki/.config/rclone/quant-googledrive.conf --allow-other --dir-cache-time 24h --poll-interval 1m --umask 002 --vfs-cache-mode full --vfs-cache-max-size 5G --vfs-cache-max-age 2h --vfs-read-chunk-size 32M --vfs-read-chunk-size-limit 512M --buffer-size 16M --transfers 4 --timeout 5m --retries 5 --log-file=/home/nishiki/.config/rclone/rclone-googledrive.log --log-level INFO
